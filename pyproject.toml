[project]
name = "agent-horde"
version = "0.1.0"
description = "A general, extensible agent harness, built one small feature at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
horde = "horde.cli:main"
horde-trace = "horde.trace_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horde"]
